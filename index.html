<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيقي الشخصي</title>

  <!-- إعدادات تطبيق الويب التقدمي (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-card {
      background-color: #1e293b;
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 16px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #ffffff;
      border: 3px solid #334155;
    }

    .status-dot {
      position: absolute;
      bottom: 4px;
      left: 4px;
      width: 16px;
      height: 16px;
      background-color: #22c55e;
      border-radius: 50%;
      border: 3px solid #1e293b;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #334155;
      color: #f8fafc;
      text-decoration: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 500;
      border: 1px solid #475569;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .action-btn:active {
      transform: scale(0.98);
      background-color: #475569;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="avatar-wrapper">
      <div class="avatar">م</div>
      <div class="status-dot"></div>
    </div>

    <h1>مرحباً بك</h1>
    <p class="subtitle">تطبيق ويب تقدمي شخصي سريع ومستقل</p>

    <div class="actions">
      <button class="action-btn primary" onclick="showNotification()">
        <span>🔔</span>
        <span>اختبار التفاعل</span>
      </button>

      <a href="https://google.com" target="_blank" class="action-btn">
        <span>🌐</span>
        <span>زيارة محرك البحث</span>
      </a>

      <button class="action-btn" onclick="shareApp()">
        <span>🔗</span>
        <span>مشاركة التطبيق</span>
      </button>
    </div>

    <div class="footer-note">يعمل بنظام نافذة مستقلة (Standalone PWA)</div>
  </div>

  <script>
    // تسجيل مشغل الخدمة (Service Worker) لتفعيل التثبيت على أندرويد
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('SW Ready'))
          .catch((err) => console.error('SW Error:', err));
      });
    }

    function showNotification() {
      alert('التطبيق يعمل بنجاح وبشكل تفاعلي!');
    }

    function shareApp() {
      if (navigator.share) {
        navigator.share({
          title: 'تطبيقي الشخصي',
          url: window.location.href
        }).catch(() => {});
      } else {
        alert('الرابط: ' + window.location.href);
      }
    }
  </script>
</body>
</html>
